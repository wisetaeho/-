<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#245c4b">
<meta name="description" content="교회 소그룹 편성을 위한 개인용 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>함께모임</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#18231f;background:#f4f7f5;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);max-width:760px;margin-inline:auto}
header{background:#245c4b;color:white;padding:20px 18px 16px;position:sticky;top:0;z-index:3}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:12px;opacity:.82}
main{padding:14px; padding-bottom:40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat,.panel,.group{background:white;border:1px solid #e0e8e3;border-radius:15px;padding:13px}
.stat b{display:block;font-size:23px}.stat span,.muted{font-size:12px;color:#66736c}
nav{display:flex;gap:6px;background:#e6eee9;padding:5px;border-radius:12px;margin:12px 0}
nav button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;color:#43564c;font-weight:700}
nav button.active{background:white;color:#245c4b;box-shadow:0 1px 4px #0001}
h2{font-size:17px;margin:4px 0 10px}.section{margin:14px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #d5dfd8;border-radius:10px;background:#fff;font:inherit;font-size:15px;color:#18231f}
textarea{min-height:115px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;background:#245c4b;color:white;padding:12px 14px;font-weight:700}
.btn.secondary{background:#e8efeb;color:#245c4b}.btn.danger{background:#fff0ef;color:#a3332d}.btn.small{padding:8px 10px;font-size:13px}
.person{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid #e5ebe7;border-radius:10px;margin:6px 0;background:#fff}
.person.selected{border:2px solid #28765d;background:#eff8f2}.person .info{min-width:0}.person strong{font-size:14px}.person small{display:block;color:#738078;font-size:12px}
.pill{font-size:11px;background:#edf2ee;padding:4px 7px;border-radius:20px;color:#526259}
.group{margin:9px 0}.grouphead{display:flex;justify-content:space-between;align-items:center;gap:8px}.grouphead strong{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{border:1px solid #dfe8e2;border-radius:9px;padding:7px 9px;background:#f8faf8;font-size:13px}
.bar{height:8px;background:#e6ece8;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#29936b}
.notice{font-size:13px;color:#245c4b;min-height:18px;margin:7px 0}.hidden{display:none!important}
label{font-size:13px;color:#4d5b53;display:block;margin-bottom:5px}.field{margin:8px 0}
.empty{padding:15px;text-align:center;color:#7b8981;font-size:13px;background:#f7f9f7;border-radius:10px}
footer{text-align:center;color:#87928b;font-size:11px;padding:20px}
</style>
</head>
<body>
<header><h1>함께모임</h1><div class="sub">교회 소그룹 편성 · 내 휴대폰에 저장</div></header>
<main>
<div class="stats">
 <div class="stat"><b id="total">0</b><span>전체 참석자</span></div>
 <div class="stat"><b id="groupCount">4</b><span>그룹 수</span></div>
 <div class="stat"><b id="unassignedCount">0</b><span>미배정</span></div>
</div>
<nav>
 <button class="active" data-tab="assign">편성</button><button data-tab="people">참석자</button><button data-tab="groups">그룹 관리</button>
</nav>
<div id="notice" class="notice" role="status"></div>
<section id="tab-assign">
 <div class="panel section">
  <h2>미배정 참석자 <span class="muted" id="unassignedLabel"></span></h2>
  <div class="muted">이름을 누른 뒤 아래 그룹의 '여기로 이동'을 누르세요.</div>
  <div id="unassignedList"></div>
 </div>
 <h2>그룹별 편성 현황</h2>
 <div id="groupCards"></div>
 <div class="section row">
  <button class="btn secondary" id="exportBtn">명단 CSV 저장</button>
  <button class="btn secondary" id="backupBtn">백업 파일 저장</button>
 </div>
 <div class="section"><button class="btn danger" id="resetBtn" style="width:100%">전체 데이터 초기화</button></div>
</section>
<section id="tab-people" class="hidden">
 <div class="panel section">
  <h2>참석자 한 명씩 등록</h2>
  <div class="field"><label for="pname">이름</label><input id="pname" placeholder="예: 김민수" autocomplete="off"></div>
  <div class="row">
   <div class="field"><label for="page">나이</label><input id="page" type="number" min="1" max="120" placeholder="예: 25" inputmode="numeric"></div>
   <div class="field"><label for="pgender">성별</label><select id="pgender"><option>남성</option><option>여성</option><option>미입력</option></select></div>
  </div>
  <button class="btn" id="addPerson" style="width:100%">참석자 추가</button>
 </div>
 <div class="panel section">
  <h2>명단 한꺼번에 붙여넣기</h2>
  <p class="muted">한 줄에 한 명씩: 이름, 나이, 성별 (쉼표 또는 탭 구분)</p>
  <textarea id="bulk" placeholder="김민수, 25, 남성&#10;이수진, 32, 여성&#10;박지훈, 45, 남성"></textarea>
  <button class="btn" id="bulkAdd" style="width:100%;margin-top:8px">명단 일괄 등록</button>
 </div>
 <div class="section"><h2>등록된 참석자 <span class="muted" id="peopleLabel"></span></h2><div id="peopleList"></div></div>
</section>
<section id="tab-groups" class="hidden">
 <div class="panel section">
  <h2>새 그룹 만들기</h2>
  <div class="row"><input id="newGroupName" placeholder="예: 청년 1그룹"><button class="btn" id="addGroup">그룹 추가</button></div>
 </div>
 <h2>그룹 이름 관리</h2><div id="groupSettings"></div>
 <p class="muted">그룹을 삭제하려면 먼저 해당 그룹의 참석자를 미배정으로 이동하세요.</p>
</section>
<footer>개인용 저장 방식 · 데이터는 이 기기의 브라우저에 저장됩니다.</footer>
</main>
<script>
const KEY='hamkke-moim-v1';
const defaultState={people:[],groups:[{id:'g1',name:'1그룹'},{id:'g2',name:'2그룹'},{id:'g3',name:'3그룹'},{id:'g4',name:'4그룹'}]};
let state=load(),selected=null,activeTab='assign';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.people)&&Array.isArray(v.groups)&&v.groups.length)return v;}catch(e){}return structuredClone(defaultState)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function id(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function msg(t){document.getElementById('notice').textContent=t;setTimeout(()=>{if(document.getElementById('notice').textContent===t)document.getElementById('notice').textContent=''},2800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function band(a){return a<20?'10대 이하':a<30?'20대':a<40?'30대':a<50?'40대':a<60?'50대':'60대 이상'}
function personHTML(p,selectable=true){return `<div class="person ${selected===p.id?'selected':''}" ${selectable?`data-person="${p.id}"`:''}><div class="info"><strong>${esc(p.name)}</strong><small>${p.age}세 · ${esc(p.gender)}</small></div>${selectable?'<span class="pill">선택</span>':`<button class="btn small secondary" data-unassign="${p.id}">미배정</button>`}</div>`}
function render(){
 document.getElementById('total').textContent=state.people.length;
 document.getElementById('groupCount').textContent=state.groups.length;
 const un=state.people.filter(p=>!p.group);document.getElementById('unassignedCount').textContent=un.length;
 document.getElementById('unassignedLabel').textContent=`(${un.length}명)`;
 document.getElementById('unassignedList').innerHTML=un.length?un.map(p=>personHTML(p)).join(''):'<div class="empty">미배정 참석자가 없습니다.</div>';
 document.getElementById('peopleLabel').textContent=`(${state.people.length}명)`;
 document.getElementById('peopleList').innerHTML=state.people.length?state.people.map(p=>`<div class="person"><div class="info"><strong>${esc(p.name)}</strong><small>${p.age}세 · ${esc(p.gender)} · ${esc(state.groups.find(g=>g.id===p.group)?.name||'미배정')}</small></div><button class="btn small danger" data-delete="${p.id}">삭제</button></div>`).join(''):'<div class="empty">등록된 참석자가 없습니다.</div>';
 document.getElementById('groupCards').innerHTML=state.groups.map(g=>{
  const ps=state.people.filter(p=>p.group===g.id),m=ps.filter(p=>p.gender==='남성').length,w=ps.filter(p=>p.gender==='여성').length,unknown=ps.filter(p=>p.gender==='미입력').length;
  const ages=['10대 이하','20대','30대','40대','50대','60대 이상'].map(b=>[b,ps.filter(p=>band(p.age)===b).length]).filter(x=>x[1]);
  return `<div class="group"><div class="grouphead"><strong>${esc(g.name)}</strong><span class="pill">${ps.length}명</span></div>
   ${selected?`<button class="btn small" style="width:100%;margin-top:9px" data-move="${g.id}">선택한 사람을 여기로 이동</button>`:''}
   ${ps.length?`<div class="chips">${ps.map(p=>`<span class="chip">${esc(p.name)} · ${p.age}세</span>`).join('')}</div>`:'<div class="empty" style="margin-top:9px">아직 배정된 참석자가 없습니다.</div>'}
   <div class="muted">남 ${m}명 · 여 ${w}명 · 미입력 ${unknown}명</div>
   <div class="chips">${ages.map(x=>`<span class="pill">${x[0]} ${x[1]}명</span>`).join('')||'<span class="muted">연령 분포 없음</span>'}</div>
   ${ps.length?`<div class="muted">그룹에서 한 명씩 빼려면 참석자 관리에서 해당 인원을 삭제하지 말고 '미배정' 버튼을 사용하세요.</div><div>${ps.map(p=>`<button class="btn small secondary" style="margin:3px" data-unassign="${p.id}">${esc(p.name)} 미배정</button>`).join('')}</div>`:''}
  </div>`;
 }).join('');
 document.getElementById('groupSettings').innerHTML=state.groups.map(g=>`<div class="person"><input aria-label="그룹 이름" data-rename="${g.id}" value="${esc(g.name)}"><button class="btn small danger" data-delete-group="${g.id}" ${state.groups.length<=1?'disabled':''}>삭제</button></div>`).join('');
}
function setTab(tab){activeTab=tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['assign','people','groups'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden',t!==tab))}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
document.getElementById('addPerson').onclick=()=>{let name=document.getElementById('pname').value.trim(),age=Number(document.getElementById('page').value),gender=document.getElementById('pgender').value;if(!name||!Number.isInteger(age)||age<1||age>120){msg('이름과 1~120 사이의 나이를 입력하세요.');return}state.people.push({id:id(),name,age,gender,group:null});document.getElementById('pname').value='';document.getElementById('page').value='';save();msg('참석자를 추가했습니다.')};
document.getElementById('bulkAdd').onclick=()=>{const lines=document.getElementById('bulk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;for(const line of lines){let a=line.split(/[,\t]/).map(x=>x.trim());let age=Number(a[1]);if(a[0]&&Number.isInteger(age)&&age>=1&&age<=120){let gender=(a[2]||'미입력').includes('여')?'여성':(a[2]||'').includes('남')?'남성':'미입력';state.people.push({id:id(),name:a[0],age,gender,group:null});added++}}if(!added){msg('등록할 수 있는 행이 없습니다. 이름, 나이, 성별 순서를 확인하세요.');return}document.getElementById('bulk').value='';save();msg(added+'명을 추가했습니다.')};
document.getElementById('addGroup').onclick=()=>{if(state.groups.length>=20){msg('그룹은 최대 20개까지 만들 수 있습니다.');return}let name=document.getElementById('newGroupName').value.trim()||`${state.groups.length+1}그룹`;state.groups.push({id:id(),name});document.getElementById('newGroupName').value='';save();msg('그룹을 만들었습니다.')};
document.body.addEventListener('click',e=>{
 const p=e.target.closest('[data-person]');if(p){selected=selected===p.dataset.person?null:p.dataset.person;render();return}
 const m=e.target.closest('[data-move]');if(m){if(!selected){msg('먼저 참석자를 선택하세요.');return}let person=state.people.find(p=>p.id===selected);if(person){person.group=m.dataset.move;selected=null;save();msg('그룹으로 이동했습니다.')}return}
 const u=e.target.closest('[data-unassign]');if(u){let p=state.people.find(p=>p.id===u.dataset.unassign);if(p){p.group=null;selected=null;save();msg('미배정으로 이동했습니다.')}return}
 const d=e.target.closest('[data-delete]');if(d&&confirm('이 참석자를 삭제할까요?')){state.people=state.people.filter(p=>p.id!==d.dataset.delete);selected=null;save();return}
 const dg=e.target.closest('[data-delete-group]');if(dg){let g=state.groups.find(g=>g.id===dg.dataset.deleteGroup);if(state.groups.length<=1)return;if(state.people.some(p=>p.group===g.id)){msg('먼저 해당 그룹의 참석자를 미배정으로 이동하세요.');return}if(confirm(g.name+'을 삭제할까요?')){state.groups=state.groups.filter(x=>x.id!==g.id);save()}return}
});
document.body.addEventListener('change',e=>{if(e.target.matches('[data-rename]')){let g=state.groups.find(g=>g.id===e.target.dataset.rename);if(g&&e.target.value.trim()){g.name=e.target.value.trim();save()}}});
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('exportBtn').onclick=()=>{let rows=[['이름','나이','성별','그룹'],...state.people.map(p=>[p.name,p.age,p.gender,state.groups.find(g=>g.id===p.group)?.name||'미배정'])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('함께모임_명단.csv',csv,'text/csv;charset=utf-8')};
document.getElementById('backupBtn').onclick=()=>download('함께모임_백업.json',JSON.stringify(state,null,2),'application/json');
document.getElementById('resetBtn').onclick=()=>{if(confirm('참석자와 그룹을 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){state=structuredClone(defaultState);selected=null;save();msg('초기화했습니다.')}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
